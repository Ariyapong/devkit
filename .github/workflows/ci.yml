name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: node -p "'icu ' + process.versions.icu + ' full-icu ' + (Intl.Segmenter !== undefined)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:browserish
      - run: npm run check:dts
      - run: npm pack --dry-run 2>&1 | tee pack.txt
      - run: "! grep -E 'test\\.js|scan-fixtures|dist-test|\\.map$' pack.txt"
